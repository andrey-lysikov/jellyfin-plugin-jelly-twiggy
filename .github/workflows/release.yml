name: Release

# vX.Y.Z.W: release for everyone (manifest.json and manifest-beta.json).
# vX.Y.Z.W-beta: GitHub pre-release, only in manifest-beta.json; notes from the topmost Changelog section.
on:
  push:
    tags: ['v*.*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BETA=false
          if [[ "$VERSION" == *-beta ]]; then
            VERSION="${VERSION%-beta}"
            BETA=true
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like vX.Y.Z.W or vX.Y.Z.W-beta, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "beta=$BETA" >> "$GITHUB_OUTPUT"

      - name: Build
        run: >
          dotnet publish Jellyfin.Plugin.JellyTwiggy/Jellyfin.Plugin.JellyTwiggy.csproj
          -c Release -o artifacts/publish -p:Version=${{ steps.version.outputs.version }}

      - name: Package
        id: package
        run: |
          ZIP="jelly-twiggy_${{ steps.version.outputs.version }}.zip"
          (cd artifacts/publish && zip "../$ZIP" Jellyfin.Plugin.JellyTwiggy.dll)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "checksum=$(md5sum "artifacts/$ZIP" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BETA: ${{ steps.version.outputs.beta }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # The "## <version>" section of Changelog.md (a beta takes the topmost one, the upcoming release),
          # without leading and trailing blank lines.
          awk -v v="## $VERSION" -v beta="$BETA" '
            /^## / { if (done) { found = 0; next } if (beta == "true" || $0 == v) { found = 1; done = 1; next } found = 0 }
            found { print }
          ' Changelog.md | awk '
            /^[[:space:]]*$/ { blank = blank $0 "\n"; next }
            { if (started) printf "%s", blank; blank = ""; started = 1; print }
          ' > changes.md

          if [ ! -s changes.md ]; then
            echo "No \"## $VERSION\" section in Changelog.md" >&2
            exit 1
          fi

          cp changes.md notes.md
          previous=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$previous" ]; then
            printf '\n**Full list of changes**: %s/compare/%s...%s\n' "$REPO_URL" "$previous" "$GITHUB_REF_NAME" >> notes.md
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          BETA: ${{ steps.version.outputs.beta }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$BETA" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" "artifacts/${{ steps.package.outputs.zip }}" \
              --title "Version $VERSION (beta)" --notes-file notes.md --prerelease
          else
            gh release create "$GITHUB_REF_NAME" "artifacts/${{ steps.package.outputs.zip }}" \
              --title "Version $VERSION" --notes-file notes.md
          fi

      - uses: actions/checkout@v7
        with:
          ref: manifest
          path: manifest-branch

      - name: Update manifests
        env:
          BETA: ${{ steps.version.outputs.beta }}
        run: |
          # The beta repository starts as a copy of the stable one and then gets every release and beta.
          if [ ! -f manifest-branch/manifest-beta.json ]; then
            cp manifest-branch/manifest.json manifest-branch/manifest-beta.json
          fi
          files="manifest-beta.json"
          if [ "$BETA" != "true" ]; then
            files="manifest.json manifest-beta.json"
          fi
          for file in $files; do
            python3 .github/scripts/update_manifest.py "manifest-branch/$file" \
              --version "${{ steps.version.outputs.version }}" \
              --url "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${{ steps.package.outputs.zip }}" \
              --checksum "${{ steps.package.outputs.checksum }}" \
              --changelog "$(cat changes.md)"
          done
          cd manifest-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json manifest-beta.json
          git commit -m "Update manifests for ${GITHUB_REF_NAME}"
          git push origin HEAD:manifest
