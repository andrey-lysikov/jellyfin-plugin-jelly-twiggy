name: Release

# vX.Y.Z.W: release for everyone, added to manifest.json.
# vX.Y.Z.W-beta: GitHub pre-release for manual install, manifest untouched; notes from the topmost Changelog section.
# Only one beta exists: a new beta tag removes the others. Any tag pushed again (git push -f) rebuilds its release
# (and its manifest entry for a release).
on:
  push:
    tags: ['v*.*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BETA=false
          if [[ "$VERSION" == *-beta ]]; then
            VERSION="${VERSION%-beta}"
            BETA=true
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like vX.Y.Z.W or vX.Y.Z.W-beta, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "beta=$BETA" >> "$GITHUB_OUTPUT"

      - name: Build
        run: >
          dotnet publish Jellyfin.Plugin.JellyTwiggy/Jellyfin.Plugin.JellyTwiggy.csproj
          -c Release -o artifacts/publish -p:Version=${{ steps.version.outputs.version }}

      - name: Package
        id: package
        run: |
          ZIP="jelly-twiggy_${{ steps.version.outputs.version }}.zip"
          (cd artifacts/publish && zip "../$ZIP" Jellyfin.Plugin.JellyTwiggy.dll)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "checksum=$(md5sum "artifacts/$ZIP" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BETA: ${{ steps.version.outputs.beta }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # The "## <version>" section of Changelog.md (a beta takes the topmost one, the upcoming release),
          # without leading and trailing blank lines.
          awk -v v="## $VERSION" -v beta="$BETA" '
            /^## / { if (done) { found = 0; next } if (beta == "true" || $0 == v) { found = 1; done = 1; next } found = 0 }
            found { print }
          ' Changelog.md | awk '
            /^[[:space:]]*$/ { blank = blank $0 "\n"; next }
            { if (started) printf "%s", blank; blank = ""; started = 1; print }
          ' > changes.md

          if [ ! -s changes.md ]; then
            echo "No \"## $VERSION\" section in Changelog.md" >&2
            exit 1
          fi

          cp changes.md notes.md
          # The latest release before this one (on a rebuild the tag itself is already a release).
          previous=$(gh release list --exclude-pre-releases --limit 50 --json tagName --jq '.[].tagName' 2>/dev/null \
            | grep -vxF "$GITHUB_REF_NAME" | head -n 1 || true)
          if [ -n "$previous" ]; then
            printf '\n**Full list of changes**: %s/compare/%s...%s\n' "$REPO_URL" "$previous" "$GITHUB_REF_NAME" >> notes.md
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          BETA: ${{ steps.version.outputs.beta }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: artifacts/${{ steps.package.outputs.zip }}
        run: |
          title="Version $VERSION"
          flags=()
          if [ "$BETA" = "true" ]; then
            title="$title (beta)"
            flags=(--prerelease)

            # One beta at a time: other pre-releases and their tags go.
            gh release list --limit 1000 --json tagName,isPrerelease \
              --jq '.[] | select(.isPrerelease) | .tagName' |
            while read -r tag; do
              if [ "$tag" != "$GITHUB_REF_NAME" ]; then
                echo "Deleting pre-release $tag"
                gh release delete "$tag" --cleanup-tag --yes
              fi
            done
          fi

          # The same tag pushed again (git push -f): replace the file and the notes with this build.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md "${flags[@]}"
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$title" --notes-file notes.md "${flags[@]}"
          fi

      # A release supersedes the betas before it: their pre-releases and tags go.
      - name: Remove pre-releases
        if: steps.version.outputs.beta != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 1000 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' |
          while read -r tag; do
            echo "Deleting pre-release $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done

      - uses: actions/checkout@v7
        if: steps.version.outputs.beta != 'true'
        with:
          ref: manifest
          path: manifest-branch

      - name: Update manifest.json
        if: steps.version.outputs.beta != 'true'
        run: |
          python3 .github/scripts/update_manifest.py manifest-branch/manifest.json \
            --version "${{ steps.version.outputs.version }}" \
            --url "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${{ steps.package.outputs.zip }}" \
            --checksum "${{ steps.package.outputs.checksum }}" \
            --changelog "$(cat changes.md)"
          cd manifest-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "manifest.json unchanged"
            exit 0
          fi
          git commit -m "Update manifest for ${GITHUB_REF_NAME}"
          git push origin HEAD:manifest
