<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Jelly Twiggy</title>
</head>
<body>
    <div id="JellyTwiggyConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <style>
                    #JellyTwiggyConfigPage [hidden] { display: none !important; }
                    #JellyTwiggyConfigPage .jtTabs { display: flex; gap: 0.5em; margin: 0 0 1.5em; border-bottom: 1px solid rgba(128, 128, 128, 0.3); }
                    #JellyTwiggyConfigPage .jtTab { margin: 0 0 -1px; padding: 0.6em 1.1em; border-radius: 0; border-bottom: 2px solid transparent; opacity: 0.7; }
                    #JellyTwiggyConfigPage .jtTab.jtTabActive { border-bottom-color: #00a4dc; opacity: 1; font-weight: 600; }
                    #JellyTwiggyConfigPage .jtPickColumns { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); column-gap: 2em; }
                    #JellyTwiggyConfigPage .jtPickTwo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 1.5em; }
                    #JellyTwiggyConfigPage .jtPickColumns .checkboxContainer { margin-bottom: 0.6em; }
                    #JellyTwiggyConfigPage .jtPickSources { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 1.5em; }
                    @media (max-width: 50em) { #JellyTwiggyConfigPage .jtPickSources { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
                    @media (max-width: 50em) { #JellyTwiggyConfigPage .jtPickColumns { grid-template-columns: minmax(0, 1fr); } }
                    @media (max-width: 30em) { #JellyTwiggyConfigPage .jtPickTwo, #JellyTwiggyConfigPage .jtPickSources { grid-template-columns: minmax(0, 1fr); } }
                </style>
                <form id="JellyTwiggyConfigForm">
                    <h2 class="sectionTitle" style="display:flex;align-items:center;gap:0.75em">
                        <img id="jtIcon" alt="Jelly Twiggy" height="56" style="display:block;height:56px;width:auto">
                        <span id="jtVersion" style="font-size:0.6em;font-weight:normal;opacity:0.7"></span>
                    </h2>

                    <div class="jtTabs" role="tablist">
                        <button is="emby-button" type="button" class="button-flat jtTab jtTabActive" role="tab" data-tab="main" data-jt-i18n="cfgTabMain">General</button>
                        <button is="emby-button" type="button" class="button-flat jtTab" role="tab" data-tab="channels" data-jt-i18n="cfgTabChannels">Themed channels</button>
                    </div>

                    <div data-tab-panel="main">
                    <div class="verticalSection">
                        <h3 class="sectionTitle" data-jt-i18n="cfgFeatures">Features</h3>
                        <div class="checkboxContainer">
                            <label>
                                <input is="emby-checkbox" type="checkbox" id="EnablePosterBadges" />
                                <span data-jt-i18n="cfgPosterBadges">Poster badges (quality, audio, rating)</span>
                            </label>
                        </div>
                        <div class="checkboxContainer">
                            <label>
                                <input is="emby-checkbox" type="checkbox" id="EnableActiveStreams" />
                                <span data-jt-i18n="cfgActiveStreams">Show the active sessions button</span>
                            </label>
                        </div>
                        <div class="checkboxContainer">
                            <label>
                                <input is="emby-checkbox" type="checkbox" id="AnimateActiveStreams" />
                                <span data-jt-i18n="cfgAnimateActiveStreams">Animate the active sessions button</span>
                            </label>
                        </div>
                        <div class="checkboxContainer">
                            <label>
                                <input is="emby-checkbox" type="checkbox" id="EnableWatchedBy" />
                                <span data-jt-i18n="cfgWatchedBy">Show who watched in the media details</span>
                            </label>
                        </div>
                        <div class="checkboxContainer">
                            <label>
                                <input is="emby-checkbox" type="checkbox" id="EnableDashboard" />
                                <span data-jt-i18n="cfgDashboard">Dashboard customization, devices and statistics blocks</span>
                            </label>
                        </div>
                    </div>

                    <div class="verticalSection">
                        <h3 class="sectionTitle" data-jt-i18n="cfgTweaks">Page tweaks</h3>
                        <div class="checkboxContainer">
                            <label>
                                <input is="emby-checkbox" type="checkbox" id="TweakItemPage" />
                                <span data-jt-i18n="cfgTweakItemPage">Refresh the media details design</span>
                            </label>
                        </div>
                        <div class="checkboxContainer">
                            <label>
                                <input is="emby-checkbox" type="checkbox" id="TweakPlayer" />
                                <span data-jt-i18n="cfgTweakPlayer">Remove the extra volume control</span>
                            </label>
                        </div>
                        <div class="checkboxContainer">
                            <label>
                                <input is="emby-checkbox" type="checkbox" id="StyleCards" />
                                <span data-jt-i18n="cfgStyleCards">Add media info to posters</span>
                            </label>
                        </div>
                    </div>
                    </div>

                    <div data-tab-panel="channels" hidden>
                    <div class="verticalSection">
                        <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1em">
                            <div class="checkboxContainer" style="margin:0">
                                <label>
                                    <input is="emby-checkbox" type="checkbox" id="EnablePicks" />
                                    <span data-jt-i18n="cfgEnablePicks">Show</span>
                                </label>
                            </div>
                            <div style="display:flex;align-items:center;gap:0.75em">
                                <b id="jtMoveFirstResult"></b>
                                <button is="emby-button" type="button" id="jtMoveFirst" class="raised emby-button" style="margin:0">
                                    <span data-jt-i18n="cfgMoveFirst">Put first</span>
                                </button>
                            </div>
                        </div>

                        <h4 data-jt-i18n="cfgPickSources">Libraries for picks</h4>
                        <div id="jtPickSources" class="jtPickSources"></div>
                        <p class="fieldDescription" data-jt-i18n="cfgPickSourcesHint">Films from these libraries appear in the channels for everyone with channel access, even without access to the library. Close the channels for children in the user's channel access settings.</p>

                        <div id="jtPickList"></div>
                    </div>
                    </div>

                    <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1em">
                        <span style="flex:1 1 15em;opacity:0.7">File Transformation: <span id="jtFileTransformation">…</span></span>
                        <button is="emby-button" type="submit" class="raised button-submit emby-button" style="margin:0;flex:0 0 auto;min-width:10em;justify-content:center;text-align:center">
                            <span data-jt-i18n="save">Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            (function () {
                const pluginId = '71c422cd-3468-4d47-aad3-19d3d0c5be48';
                const flags = ['EnablePosterBadges', 'EnableActiveStreams', 'AnimateActiveStreams', 'EnableWatchedBy', 'EnableDashboard', 'TweakItemPage', 'TweakPlayer', 'StyleCards', 'EnablePicks'];
                const page = document.querySelector('#JellyTwiggyConfigPage');
                // The client script provides translations; without it the English text stays.
                const t = (key, fallback) => (window.JellyTwiggy && window.JellyTwiggy.t ? window.JellyTwiggy.t(key) : fallback);
                const escapeHtml = (text) => String(text).replace(/[&<>"']/g, (c) => '&#' + c.charCodeAt(0) + ';');
                const normalize = (id) => String(id || '').replace(/-/g, '').toLowerCase();
                let picksConfig = null;

                function checkbox(attributes, checked, label) {
                    return '<div class="checkboxContainer"><label><input is="emby-checkbox" type="checkbox" ' + attributes + (checked ? ' checked' : '')
                        + ' /><span>' + escapeHtml(label) + '</span></label></div>';
                }

                const franchiseIds = (picks) => picks.Catalog.filter((pick) => pick.Kind === 'Franchise').map((pick) => pick.Id);

                // Movie and mixed libraries; the plugin takes only films from them.
                function renderPicks(config, folders, picks) {
                    const sources = (config.PickSourceLibraries || []).map(normalize);
                    page.querySelector('#jtPickSources').innerHTML = folders
                        .filter((folder) => !folder.CollectionType || folder.CollectionType === 'movies')
                        .map((folder) => checkbox('data-library="' + escapeHtml(folder.ItemId) + '"', sources.includes(normalize(folder.ItemId)), folder.Name))
                        .join('');

                    const disabled = config.DisabledPicks || [];
                    // A column per channel; franchises are switched together by one checkbox under the holidays.
                    const list = (kind) => picks.Catalog.filter((pick) => pick.Kind === kind)
                        .map((pick) => checkbox('data-pick="' + escapeHtml(pick.Id) + '"', !disabled.includes(pick.Id), pick.Name))
                        .join('');
                    const franchises = checkbox('data-franchises', franchiseIds(picks).some((id) => !disabled.includes(id)), t('cfgFranchises', 'Favourite franchises'));
                    const column = (title, content) => '<div><p><b>' + escapeHtml(title) + '</b></p>' + content + '</div>';
                    page.querySelector('#jtPickList').innerHTML = '<div class="jtPickColumns">'
                        + column(picks.ThemedChannel, '<div class="jtPickTwo">' + list('Holiday') + franchises + '</div>')
                        + column(picks.BestChannel, list('Top'))
                        + '</div>';

                }

                page.querySelectorAll('[data-tab]').forEach(function (tab) {
                    tab.addEventListener('click', function () {
                        page.querySelectorAll('[data-tab]').forEach((other) => {
                            other.classList.toggle('jtTabActive', other === tab);
                            other.setAttribute('aria-selected', String(other === tab));
                        });
                        page.querySelectorAll('[data-tab-panel]').forEach((panel) => {
                            panel.hidden = panel.dataset.tabPanel !== tab.dataset.tab;
                        });
                    });
                });

                // Once done, the button says so and stays disabled until the page is opened again.
                page.querySelector('#jtMoveFirst').addEventListener('click', function () {
                    const button = this;
                    const result = page.querySelector('#jtMoveFirstResult');
                    result.textContent = '';
                    button.disabled = true;
                    fetch(ApiClient.getUrl('JellyTwiggy/Picks/MoveFirst'), {
                        method: 'POST',
                        headers: { Authorization: 'MediaBrowser Token="' + ApiClient.accessToken() + '"' }
                    }).then(function (response) {
                        if (!response.ok) {
                            throw new Error(String(response.status));
                        }
                        button.querySelector('span').textContent = t('cfgMovedFirst', 'Done');
                    }).catch(function () {
                        result.textContent = t('loadFailed', 'Failed');
                        button.disabled = false;
                    });
                });

                page.addEventListener('pageshow', function () {
                    const moveFirst = page.querySelector('#jtMoveFirst');
                    moveFirst.disabled = false;
                    page.querySelector('#jtMoveFirstResult').textContent = '';
                    page.querySelectorAll('[data-jt-i18n]').forEach(function (element) {
                        element.textContent = t(element.dataset.jtI18n, element.textContent);
                    });
                    page.querySelector('#jtIcon').src = ApiClient.getUrl('JellyTwiggy/client/img/wordmark.png');

                    Dashboard.showLoadingMsg();
                    Promise.all([
                        ApiClient.getPluginConfiguration(pluginId),
                        ApiClient.getVirtualFolders(),
                        ApiClient.getJSON(ApiClient.getUrl('JellyTwiggy/Picks'))
                    ]).then(function ([config, folders, picks]) {
                        flags.forEach(function (flag) {
                            page.querySelector('#' + flag).checked = config[flag];
                        });
                        picksConfig = picks;
                        renderPicks(config, folders || [], picks);
                        Dashboard.hideLoadingMsg();
                    }, function () {
                        Dashboard.hideLoadingMsg();
                    });

                    ApiClient.getJSON(ApiClient.getUrl('JellyTwiggy/Status')).then(function (status) {
                        page.querySelector('#jtVersion').textContent = 'v' + status.Version;
                        page.querySelector('#jtFileTransformation').textContent = status.FileTransformationRegistered
                            ? t('cfgRegistered', 'registered')
                            : t('cfgNotRegistered', 'not registered — install the File Transformation plugin and restart the server');
                    });
                });

                page.querySelector('#JellyTwiggyConfigForm').addEventListener('submit', function (e) {
                    e.preventDefault();
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                        flags.forEach(function (flag) {
                            config[flag] = page.querySelector('#' + flag).checked;
                        });
                        config.PickSourceLibraries = Array.from(page.querySelectorAll('[data-library]:checked')).map((input) => input.dataset.library);
                        if (picksConfig) {
                            config.DisabledPicks = Array.from(page.querySelectorAll('[data-pick]')).filter((input) => !input.checked).map((input) => input.dataset.pick);
                            if (!page.querySelector('[data-franchises]').checked) {
                                config.DisabledPicks.push(...franchiseIds(picksConfig));
                            }
                        }
                        ApiClient.updatePluginConfiguration(pluginId, config).then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });
                    });
                    return false;
                });
            })();
        </script>
    </div>
</body>
</html>
